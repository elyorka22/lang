name: lingua
description: Lingua — Language Exchange & AI Tutor. Meet natives, chat, and learn with AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking & realtime
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  connectivity_plus: ^6.1.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6

  # Media & voice
  record: ^5.1.2
  just_audio: ^0.9.42
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  permission_handler: ^11.3.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Push — add firebase_core + firebase_messaging when google-services are configured
  # firebase_core: ^3.8.0
  # firebase_messaging: ^15.1.5

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3
  flutter_slidable: ^3.1.1
  emoji_picker_flutter: ^3.1.0
  photo_view: ^0.15.0
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.7
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
