name: lingua
description: Lingua — English vocabulary learning with SRS and word games.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking & realtime
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3
  intl: any
  uuid: ^4.5.1
  equatable: ^2.0.7
  timeago: ^3.7.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
